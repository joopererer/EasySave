name: Release Parser Bundle

on:
  push:
    tags:
      - 'parser-v*'

permissions:
  contents: write

concurrency:
  group: parser-release
  cancel-in-progress: false

jobs:
  release:
    name: Test, Build, Sign, Upload, Verify and Update Channel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        working-directory: extension
        run: npm ci

      - name: Setup Flutter for canonical URL validation
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve App dependencies
        working-directory: app
        run: flutter pub get

      - name: Run all tests
        working-directory: extension
        run: npm test

      - name: Verify effective release and APK configuration parity
        working-directory: extension
        run: npm run build:candidate

      - name: Verify current App required configuration contract
        working-directory: app
        run: flutter test --no-pub test/parser_config_contract_test.dart

      - name: Require signing key
        env:
          PARSER_SIGNING_KEY: ${{ secrets.PARSER_SIGNING_KEY }}
        run: |
          if [[ -z "$PARSER_SIGNING_KEY" ]]; then
            echo "::error::PARSER_SIGNING_KEY is required"
            exit 1
          fi
          if [[ ! "$PARSER_SIGNING_KEY" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "::error::PARSER_SIGNING_KEY must contain 64 hex characters"
            exit 1
          fi

      - name: Build and sign v2 release
        working-directory: extension
        env:
          PARSER_SIGNING_KEY: ${{ secrets.PARSER_SIGNING_KEY }}
        run: npm run build:release

      - name: Upload Release attachments
        uses: softprops/action-gh-release@v2
        with:
          files: |
            extension/dist/release/manifest.json
            extension/dist/release/parser.js
          fail_on_unmatched_files: true
          overwrite_files: false
          name: Parser ${{ github.ref_name }}
          generate_release_notes: true

      - name: Read back and verify Release attachments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern manifest.json --pattern parser.js \
            --dir "$RUNNER_TEMP/parser-readback"
          node extension/scripts/verify_release.js "$RUNNER_TEMP/parser-readback"

      - name: Commit v2 channel manifest to master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          export PARSER_BUILT_MANIFEST="$GITHUB_WORKSPACE/extension/dist/release/manifest.json"
          git worktree add --detach "$RUNNER_TEMP/parser-channel-master" origin/master
          cd "$RUNNER_TEMP/parser-channel-master"
          node --input-type=module <<'NODE'
          import { readFileSync, existsSync, mkdirSync, writeFileSync } from 'node:fs';
          const bytes = readFileSync(process.env.PARSER_BUILT_MANIFEST);
          const candidate = JSON.parse(JSON.parse(bytes).payload);
          const target = 'spec/v2/manifest.json';
          if (existsSync(target)) {
            const previousBytes = readFileSync(target);
            const previous = JSON.parse(JSON.parse(previousBytes).payload);
            if (candidate.manifestVersion < previous.manifestVersion ||
                (candidate.manifestVersion === previous.manifestVersion && !bytes.equals(previousBytes))) {
              throw new Error('Refusing an older or conflicting channel manifest');
            }
          }
          mkdirSync('spec/v2', { recursive: true });
          writeFileSync(target, bytes);
          NODE
          git add spec/v2/manifest.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(release): update v2 parser manifest for $GITHUB_REF_NAME [skip ci]"
            git push origin HEAD:master
          fi
